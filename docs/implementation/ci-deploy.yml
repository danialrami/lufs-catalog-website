name: Build & Deploy → hostinger

# Builds the static site and publishes the built output to the `hostinger` branch,
# which Hostinger's Git auto-deploy webhook pulls into public_html (catalog.lufs.audio).
#
# Copy this into place (the PR bot can't commit workflow files itself):
#   mkdir -p .github/workflows && cp docs/implementation/ci-deploy.yml .github/workflows/deploy.yml
#
# This is the remote counterpart to ./catalog-deploy.sh: a push to `main` (e.g. committed
# content from a local `pnpm catalog:ingest`) deploys WITHOUT anyone running a local build.
# The manual script still works for offline/local deploys; both publish the `hostinger` branch.
#
# REMOTE (R2) BUILDS: the player resolves audio keys via PUBLIC_R2_STREAM_URL, which is
# baked into the bundle at BUILD time. .env.production is gitignored (not in CI). You can
# set these as repo *Variables* (Settings → Secrets and variables → Actions → Variables):
#   - PUBLIC_R2_STREAM_URL   e.g. https://stream.lufsaud.io
#   - PUBLIC_SITE_URL        e.g. https://catalog.lufs.audio
# …but the Build step below also falls back to the production values if the Variables are
# unset, so audio works out of the box. (An empty PUBLIC_R2_STREAM_URL = no audio on the
# live site — that bit us once; the fallback prevents a recurrence.)
#
# Cover art + the proof-of-work report are served from the PUBLIC R2 bucket's CDN domain
# (PUBLIC_R2_BASE_URL, e.g. https://cdn.lufsaud.io). Those absolute URLs are baked into the
# CONTENT at *ingest* time (which runs locally with the NAS + ffmpeg), so CI needs NO extra
# variable for them — they're already in the committed src/content/releases/*.md, and the
# heavy files live on R2, not in git. PUBLIC_R2_BASE_URL + R2_PUBLIC_BUCKET_NAME only need to
# be in your LOCAL .env.production for `pnpm catalog:ingest`.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build (static)
        run: pnpm build
        env:
          # Exposed to the browser bundle (safe to be public). These MUST be present at
          # build time — if PUBLIC_R2_STREAM_URL is empty the player ships with no Worker
          # URL and audio silently fails to load. Prefer repo Variables (Settings → Secrets
          # and variables → Actions → Variables); fall back to the known production values
          # so a missing/forgotten Variable can't break audio.
          PUBLIC_R2_STREAM_URL: ${{ vars.PUBLIC_R2_STREAM_URL || 'https://stream.lufsaud.io' }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://catalog.lufs.audio' }}

      # Do NOT set force_orphan: true. It rewrites `hostinger` as a fresh orphan commit each
      # deploy (no shared history), which makes Hostinger's Git auto-deploy fail with
      # "divergent branches / Need to specify how to reconcile" and forces a manual wipe +
      # re-pull every time. Keeping linear history lets Hostinger fast-forward `git pull`
      # automatically. dist/ is tiny (HTML/CSS/JS; all media lives on R2), so the branch
      # history won't bloat. (One-time: after switching away from force_orphan, resync
      # Hostinger once — fresh pull, or `git reset --hard origin/hostinger` — to bridge the
      # old orphan history; every push after that auto-deploys.)
      - name: Publish dist/ to the hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger
          commit_message: "deploy ${{ github.sha }}"
