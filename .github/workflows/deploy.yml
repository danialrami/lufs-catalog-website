# Build and Deploy Astro Site to Hostinger
# 
# This workflow builds the Astro site on every push to main and deploys to Hostinger
# via the hostinger branch (syncing only the dist/ folder).
#
# For local development, use `./catalog-dev.sh` or `pnpm dev`.
# For production deployment, this workflow auto-builds and pushes dist/ to the hostinger branch.
#
# To enable deployment:
# 1. Uncomment the deploy step below (currently commented for safety)
# 2. Set up GitHub secrets: HOSTINGER_HOST, HOSTINGER_USER, HOSTINGER_SSH_KEY
# 3. Or use the manual subtree split method documented in catalog-deploy.sh

name: Build & Deploy Astro to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggering from GitHub UI

# Prevent concurrent runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build Astro site
        run: pnpm build
        env:
          # Required environment variables (set in GitHub Actions secrets)
          # R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          # R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # CATALOG_SOURCE_PATH: /workspace/catalog-source
          # GITHUB_REPO: ${{ secrets.GITHUB_REPO }}
          # HOSTINGER_BRANCH: hostinger
          BASE_URL: https://catalog.lufs.audio/

      - name: Build static site (alternative with pnpm)
        run: |
          # Alternative build command if needed
          pnpm build --out dist
          ls -la dist/

      # Uncomment and configure these steps to enable actual deployment
      # The deploy method using SSH (Option 1: ssh-action)
      # Requires these GitHub secrets:
      # - HOSTINGER_HOST (IP or hostname)
      # - HOSTINGER_USER (SSH username)
      # - HOSTINGER_SSH_KEY (private SSH key)
      #
      # - name: Deploy to Hostinger via SSH
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.HOSTINGER_HOST }}
      #     username: ${{ secrets.HOSTINGER_USER }}
      #     key: ${{ secrets.HOSTINGER_SSH_KEY }}
      #     script: |
      #       cd /var/www/catalog.lufs.audio
      #       
      #       # Pull latest code
      #       git fetch origin
      #       git reset --hard main
      #       
      #       # Install dependencies and build on server
      #       curl -fsSL https://pnpm.io/install.sh | sh -
      #       pnpm install --frozen-lockfile
      #       pnpm build
      #       
      #       # Deploy dist/ to public_html
      #       rm -rf /var/www/catalog.lufs.audio/public_html/*
      #       cp -r dist/* /var/www/catalog.lufs.audio/public_html/
      #       
      #       echo "Deployed successfully!"

      # Alternative: Deploy via subtree split (Option 2: Manual workflow)
      # This method only pushes the dist/ folder to hostinger branch
      # See docs/TDD.md Section 13 for full details
      #
      # Workflow steps would be:
      # 1. Build site (done above)
      # 2. Setup git config
      # 3. Create subtree split of dist/
      # 4. Force push to hostinger branch
      #
      # NOTE: This requires git push permissions and is commented out for safety.
      # Uncomment only after setting up proper secrets and testing.
      #
      # - name: Deploy via subtree split to hostinger branch
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   run: |
      #     git config --global user.name "GitHub Actions"
      #     git config --global user.email "actions@github.com"
      #     
      #     # Create temp branch for dist/
      #     git subtree split --prefix dist -b hostinger-dist
      #     
      #     # Push to hostinger branch (requires personal access token)
      #     git push -f origin hostinger-dist:hostinger
      #
      # For production use, implement proper authentication:
      # - Use secrets.GITHUB_TOKEN or create a deploy token
      # - Configure SSH in runner environment
      # - Test with dry-run first

      # Upload build artifact for inspection (always runs)
      - name: Upload dist/ artifact
        uses: actions/upload-artifact@v3
        with:
          name: dist-site
          path: dist/
          retention-days: 7

      - name: Show build summary
        run: |
          echo "Build complete! Site ready for deployment."
          echo "To deploy manually:"
          echo "  ./catalog-deploy.sh [--ingest]"
          echo ""
          echo "Or configure the deploy steps above and uncomment them."
          ls -lh dist/
